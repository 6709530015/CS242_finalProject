<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Reminder System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>ระบบรวบรวมนัดหมาย</h1>
        <p class="subtitle">จัดการงาน สอบ และวันสำคัญของนักศึกษา</p>
        <nav>
            <a href="{{ url_for('index') }}">หน้าหลัก</a>
            <a href="{{ url_for('add_event') }}">เพิ่มงานใหม่</a>
            <a href="{{ url_for('stats') }}">📊 สถิติ</a>
        {% if session.get('logged_in') %}
        <a href="{{ url_for('logout') }}" 
           class="btn btn-danger" 
           onclick="return confirm('คุณต้องการออกจากระบบใช่ไหม?')">Logout from Google</a>
        {% else %}
        <a href="{{ url_for('login_google') }}" class="btn btn-primary">Login with Google</a>
        {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
